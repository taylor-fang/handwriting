<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Hand</title>
<meta name="description" content="Turn a photo of your handwriting into a font.">
<meta name="theme-color" content="#f3efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="fonts/PaperHand.css">
<style>
  :root {
    --paper: #f3efe6;
    --ink: #000;
    --soft: #8d877c;
    --faint: #d8d0c2;
    --accent: #8c6640;
    --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--font); }
  main { max-width: 600px; margin: 0 auto; padding: 72px 16px 96px; }
  h1 { font: 400 44px/1 "Paper Hand", var(--font); margin: 0 0 56px; color: rgba(0, 0, 0, .9); }

  .step { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: baseline; margin: 0 0 48px; }
  .n { color: var(--accent); font-weight: 600; }
  .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .small { font-size: 14px; color: var(--accent); text-decoration: none; }
  .small:hover { text-decoration: underline; }
  .how { margin: 16px 0 0; max-width: 46ch; }

  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 8px; border: 0;
    background: var(--accent); color: #fff; font: 500 16px/1.2 var(--font); cursor: pointer; }
  .btn:hover { background: #7a5836; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  a.small[aria-disabled=true] { opacity: .35; pointer-events: none; }

  .msg { font-size: 14px; color: var(--accent); margin: 14px 0 0; }
  .msg:empty { display: none; }
  #work { display: none; margin-top: 28px; }
  .loaded #work { display: block; }

  .ink { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; font-size: 14px; color: var(--soft); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .cells { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
  .cell { position: relative; background: #fffdf8; border-radius: 3px; }
  .cell canvas { display: block; width: 100%; height: auto; }
  .cell span { position: absolute; left: 3px; top: 1px; font-size: 10px; line-height: 1.2; color: var(--accent); }

  #try { display: none; width: 100%; margin: 0 0 20px; padding: 0 0 6px; border: 0; border-bottom: 1px solid var(--faint); border-radius: 0;
    background: transparent; color: var(--ink); font-size: 34px; line-height: 1.3; outline: none; }
  .ready #try { display: block; }

  @media (max-width: 560px) {
    main { padding-top: 48px; }
    h1 { margin-bottom: 40px; }
    .step { grid-template-columns: 26px minmax(0, 1fr); margin-bottom: 40px; }
    .cells { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    #try { font-size: 28px; }
  }
</style>
</head>
<body>
<main>
  <h1>Paper Hand</h1>

  <section class="step" id="step1">
    <span class="n">1</span>
    <div>
      <label class="btn" for="file">Upload a photo</label>
      <input type="file" id="file" accept="image/*">
      <p class="how">Use pen on a blank sheet of paper. Carefully write out every letter of the alphabet, both uppercase and lowercase, and every number. Upload a clear picture.</p>
      <p class="msg" id="msg"></p>
      <div id="work">
        <div class="ink"><label for="threshold">Ink</label><input type="range" id="threshold" min="0.3" max="0.9" step="0.01" value="0.6"></div>
        <div class="cells" id="cells"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step2">
    <span class="n">2</span>
    <div>
      <input type="text" id="try" value="The quick brown fox" spellcheck="false" aria-label="Try your font">
      <div class="line">
        <button class="btn" id="getCss" type="button" disabled>Download PaperHand.css</button>
        <a class="small" id="getWoff" href="#" aria-disabled="true">.woff</a>
        <a class="small" id="getOtf" href="#" aria-disabled="true">.otf</a>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js" integrity="sha384-3TaxGqyHrMuRIWY5Z5WHNIzgNRqGIUJE+mk6tm+g1wkm9Ux2kUyOLfy9AsNWXA6u" crossorigin="anonymous"></script>
<script src="js/imaging.js"></script>
<script src="js/reader.js"></script>
<script src="js/trace.js"></script>
<script src="js/font.js"></script>
<script src="js/app.js"></script>
</body>
</html>
